<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#20252b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Repair Legend v1.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!--========================
        BACKGROUND
    ========================-->

    <div id="background">

        <div id="wall"></div>
        <div id="floor"></div>

        <div id="entrance">
            <span>入口</span>
        </div>

        <div id="counter">
            <div class="desk"></div>
        </div>

    </div>

    <!--========================
        HUD
    ========================-->

    <header id="hud">

        <div class="hudBox">
            <div class="label">LEVEL</div>
            <div id="level">1</div>
        </div>

        <div class="hudBox">
            <div class="label">RANK</div>
            <div id="rank">D</div>
        </div>

        <div class="hudBox">
            <div class="label">COMBO</div>
            <div id="combo">0</div>
        </div>

        <div class="hudBox money">
            <div class="label">売上</div>
            <div id="money">¥0</div>
        </div>

    </header>

    <!--========================
        CUSTOMER AREA
    ========================-->

    <section id="customerArea">

        <!-- CUSTOMER -->

        <div id="customer">

            <img
                src="images/customer.png"
                id="customerSprite"
                alt="customer">

        </div>

        <!-- FENI -->

        <div id="feni">

            <img
                src="images/feni.png"
                id="feniSprite"
                alt="Feni">

        </div>

        <!-- SPEECH -->

        <div id="speech">

            <div id="speechText">
                ご来店ありがとうございます！
            </div>

        </div>

    </section>

    <!--========================
        REPAIR GAUGE
    ========================-->

    <section id="repairPanel">

        <div class="panelTitle">
            修理進行
        </div>

        <div id="repairGaugeFrame">

            <div id="repairGauge"></div>

        </div>

        <div id="repairPercent">
            0%
        </div>

    </section>

    <!--========================
        EFFECTS
    ========================-->

    <div id="effects">

        <div id="comboEffect"></div>

        <div id="coinEffect"></div>

        <div id="rankUpEffect"></div>

        <div id="completeEffect">
            修理完了！
        </div>

    </div>

    <!--========================
        TOUCH MAP
    ========================-->

    <div id="touchMap">

        <button class="touchSpot" id="spotCounter"></button>

        <button class="touchSpot" id="spotPoster"></button>

        <button class="touchSpot" id="spotShelf"></button>

        <button class="touchSpot" id="spotDoor"></button>

    </div>

</div>

<!--====================================
        QUIZ WINDOW
=====================================-->

<section id="quizWindow">

    <!-- TOP -->

    <div id="quizTop">

        <div id="category">
            iPhone
        </div>

        <div id="timerBox">

            <span>TIME</span>

            <span id="timer">
                10
            </span>

        </div>

    </div>

    <!-- QUESTION -->

    <div id="question">

        修理知識クイズがここに表示されます。
    </div>

    <!-- ANSWERS -->

    <div id="answers">

        <button class="answerBtn" data-answer="0">
            A
        </button>

        <button class="answerBtn" data-answer="1">
            B
        </button>

        <button class="answerBtn" data-answer="2">
            C
        </button>

        <button class="answerBtn" data-answer="3">
            D
        </button>

    </div>

</section>

<!--====================================
        START MENU
=====================================-->

<div id="startScreen">

    <div id="logo">

        <h1>
            REPAIR LEGEND
        </h1>

        <h2>
            v1.0
        </h2>

    </div>

    <div id="logoCharacter">

        <img
            src="images/feni.png"
            alt="Feni">

    </div>

    <div id="description">

        スマホ修理店経営 × 修理知識ゲーム

    </div>

    <button id="startButton">

        GAME START

    </button>

</div>

<!--====================================
        RECEPTION
=====================================-->

<div id="receptionWindow">

    <div class="windowTitle">

        お客様対応

    </div>

    <div id="customerSymptom">

        症状がここへ表示されます。

    </div>

    <button id="acceptButton">

        受付する

    </button>

</div>

<!--====================================
        RESULT
=====================================-->

<div id="resultWindow">

    <h2>

        RESULT

    </h2>

    <div class="resultRow">

        <span>ランク</span>

        <span id="resultRank">
            D
        </span>

    </div>

    <div class="resultRow">

        <span>コンボ</span>

        <span id="resultCombo">
            0
        </span>

    </div>

    <div class="resultRow">

        <span>売上</span>

        <span id="resultMoney">
            ¥0
        </span>

    </div>

    <button id="nextCustomer">

        次のお客様

    </button>

</div>

<!--====================================
        AUDIO
=====================================-->

<audio id="bgm" loop preload="auto">
    <source src="sounds/bgm.mp3" type="audio/mpeg">
</audio>

<audio id="tapSound" preload="auto">
    <source src="sounds/tap.mp3" type="audio/mpeg">
</audio>

<audio id="bellSound" preload="auto">
    <source src="sounds/bell.mp3" type="audio/mpeg">
</audio>

<audio id="correctSound" preload="auto">
    <source src="sounds/correct.mp3" type="audio/mpeg">
</audio>

<audio id="wrongSound" preload="auto">
    <source src="sounds/wrong.mp3" type="audio/mpeg">
</audio>

<audio id="repairSound" preload="auto">
    <source src="sounds/repair.mp3" type="audio/mpeg">
</audio>

<audio id="coinSound" preload="auto">
    <source src="sounds/coin.mp3" type="audio/mpeg">
</audio>

<!--====================================
        SCRIPTS
=====================================-->

<script src="quiz.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>

</body>
</html>
