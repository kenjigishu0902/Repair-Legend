<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Repair Legend v0.3</title>
<style>
:root{
  --panel:#171717f4;
  --gold:#ffb000;
  --red:#c9202c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;touch-action:manipulation}
#game{
  position:relative;width:100vw;height:100dvh;overflow:hidden;
  background:linear-gradient(#f4f0e8 0 72%,#d0b898 72% 100%);
  user-select:none;
}
#hud{
  position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;
  display:flex;gap:6px;flex-wrap:wrap;z-index:50;pointer-events:none
}
.badge,.soundBtn{
  background:#fff;border:0;border-radius:12px;padding:8px 10px;
  font-weight:900;font-size:14px;box-shadow:0 3px 10px #0003
}
.soundBtn{pointer-events:auto}
.soundBtn.off{opacity:.45}
#status{margin-left:auto;background:#222;color:#fff}
#world{
  position:absolute;left:0;right:0;top:62px;bottom:82px;overflow:hidden;
}
.sign{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  background:var(--red);color:#fff;padding:8px 17px;border-radius:9px;
  font-weight:1000;z-index:3
}
.station{
  position:absolute;border:0;color:#fff;font-weight:1000;border-radius:15px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px #0004;
  z-index:4;touch-action:manipulation
}
.station:active{transform:scale(.98)}
#counter{left:5vw;top:22%;width:34vw;height:74px;background:#8e5827}
#parts{right:5vw;top:22%;width:29vw;height:74px;background:#2e6f8d}
#desk{right:8vw;top:58%;width:38vw;height:82px;background:#5d5d5d}
#customer{
  position:absolute;left:8vw;top:56%;width:74px;height:104px;border-radius:38px 38px 14px 14px;
  background:linear-gradient(#69aff4 0 36%,#efc49e 36% 61%,#314f83 61%);
  box-shadow:0 8px 16px #0004;z-index:5
}
#customer::after{
  content:"お客様";position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
  font-size:12px;font-weight:900;white-space:nowrap;color:#111
}
#player{
  position:absolute;width:112px;left:44%;top:53%;z-index:8;
  filter:drop-shadow(0 10px 7px #0004);
  touch-action:none;cursor:grab
}
#hint{
  position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  background:#fff;border-radius:999px;padding:8px 13px;font-weight:900;font-size:13px;
  box-shadow:0 4px 14px #0003;z-index:12;white-space:nowrap
}
#actionBar{
  position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));
  height:64px;display:flex;gap:8px;z-index:45
}
.actionBtn{
  flex:1;border:0;border-radius:14px;background:#fff;font-weight:1000;
  box-shadow:0 4px 14px #0004
}
.actionBtn.primary{background:var(--gold)}
.actionBtn:disabled{opacity:.45}
#sheet{
  position:absolute;left:8px;right:8px;bottom:80px;z-index:60;
  background:var(--panel);color:#fff;border-radius:18px;padding:14px;
  box-shadow:0 12px 30px #0007;max-height:44dvh;overflow:auto;
  transform:translateY(calc(100% + 95px));transition:transform .25s ease
}
#sheet.open{transform:translateY(0)}
#sheetHead{display:flex;align-items:center;gap:8px}
#sheetTitle{font-size:18px;font-weight:1000;flex:1}
#closeSheet{border:0;background:#fff;color:#111;border-radius:10px;padding:7px 10px;font-weight:900}
#sheetText{margin-top:7px;line-height:1.45;font-size:14px;color:#eee}
#choices{margin-top:9px}
.choice{
  width:100%;border:0;border-radius:11px;padding:11px;margin-top:7px;
  background:#fff;color:#111;text-align:left;font-weight:900
}
.choice:disabled{opacity:.65}
#result{margin-top:10px;font-size:17px;font-weight:1000}
.good{color:#78e78a}.bad{color:#ff7777}
#progressWrap{display:none;height:12px;background:#555;border-radius:999px;overflow:hidden;margin-top:12px}
#progress{height:100%;width:0;background:var(--gold)}
#nextBtn{
  display:none;width:100%;border:0;border-radius:12px;padding:12px;margin-top:10px;
  background:var(--gold);font-weight:1000
}
#gate{
  position:absolute;inset:0;z-index:100;background:#000c;color:#fff;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:20px
}
#gateCard{max-width:430px}
#gate h1{font-size:28px;margin-bottom:8px}
#gate p{line-height:1.5;margin-bottom:16px}
#startBtn{border:0;background:var(--gold);padding:14px 20px;border-radius:14px;font-size:18px;font-weight:1000}
@media(max-width:700px){
  #world{top:104px;bottom:82px}
  #counter{left:4vw;top:18%;width:42vw;height:64px}
  #parts{right:4vw;top:18%;width:38vw;height:64px}
  #desk{right:5vw;top:60%;width:48vw;height:72px}
  #customer{left:6vw;top:60%;width:62px;height:90px}
  #player{width:92px;left:42%;top:52%}
  #hint{font-size:12px;bottom:4px}
  #sheet{bottom:78px;max-height:48dvh}
}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div class="badge">💰 <span id="money">0</span>円</div>
    <div class="badge">⭐ Lv.<span id="level">1</span></div>
    <div class="badge">🔥 <span id="combo">0</span>コンボ</div>
    <div id="status" class="badge">待機中</div>
    <button id="bgmBtn" class="soundBtn">🎵 BGM</button>
    <button id="sfxBtn" class="soundBtn">🔊 効果音</button>
  </div>

  <div id="world">
    <div class="sign">REPAIR LEGEND</div>
    <button id="counter" class="station">受付</button>
    <button id="parts" class="station">パーツ棚</button>
    <button id="desk" class="station">修理台</button>
    <div id="customer"></div>
    <img id="player" src="feni.png" alt="フェニちゃん">
    <div id="hint">フェニちゃんを指で動かせます</div>
  </div>

  <div id="sheet">
    <div id="sheetHead">
      <div id="sheetTitle">修理依頼</div>
      <button id="closeSheet">閉じる</button>
    </div>
    <div id="sheetText"></div>
    <div id="choices"></div>
    <div id="result"></div>
    <div id="progressWrap"><div id="progress"></div></div>
    <button id="nextBtn">次のお客様へ</button>
  </div>

  <div id="actionBar">
    <button id="talkBtn" class="actionBtn primary">お客様に話す</button>
    <button id="centerBtn" class="actionBtn">中央へ戻す</button>
  </div>

  <div id="gate">
    <div id="gateCard">
      <h1>Repair Legend v0.3</h1>
      <p>タップすると音が有効になります。<br>フェニちゃんは指で自由に動かせます。</p>
      <button id="startBtn">ゲーム開始 🔊</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const jobs=[
 {device:"iPhone 13",symptom:"バッテリーの減りが早い",answer:"バッテリー交換",choices:["画面交換","バッテリー交換","ドック交換"],price:10800},
 {device:"iPhone 11",symptom:"画面が真っ暗だが着信音は鳴る",answer:"画面交換",choices:["画面交換","バッテリー交換","カメラ交換"],price:9800},
 {device:"Pixel 7",symptom:"背面が浮き、バッテリーが膨張している",answer:"バッテリー交換",choices:["背面交換","バッテリー交換","スピーカー交換"],price:12800},
 {device:"Galaxy S23 Ultra",symptom:"画面割れとタッチ不良",answer:"画面交換",choices:["画面交換","充電口交換","基板洗浄"],price:49700},
 {device:"Nintendo Switch",symptom:"ゲームカードを読み込まない",answer:"ゲームカードスロット交換",choices:["SDスロット交換","ゲームカードスロット交換","液晶交換"],price:14800},
 {device:"AQUOS wish2",symptom:"電源は入っているが画面だけ映らない",answer:"画面交換",choices:["画面交換","バイブ交換","SIM交換"],price:15800},
 {device:"iPhone SE2",symptom:"指紋認証は使えるがホームボタンを押しても反応しない",answer:"ホームボタン周辺の確認",choices:["ホームボタン周辺の確認","バッテリー交換","カメラ交換"],price:7800},
 {device:"iPhone 15",symptom:"ケーブルを挿しても充電反応がない",answer:"ドックコネクタ診断",choices:["ドックコネクタ診断","画面交換","近接センサー交換"],price:16800},
 {device:"Switch 有機EL",symptom:"TV出力はできるが本体画面だけ真っ黒",answer:"液晶・表示系統の確認",choices:["液晶・表示系統の確認","Joy-Con交換","Wi-Fi修理"],price:26000},
 {device:"iPhone 13 Pro Max",symptom:"落下後に緑色の線が表示される",answer:"画面交換",choices:["画面交換","スピーカー交換","バッテリー交換"],price:29800}
];

let money=0,level=1,combo=0,cleared=0,current=null,state="idle";
let audioCtx,bgmTimer,bgmOn=true,sfxOn=true;
let dragging=false,offsetX=0,offsetY=0;

function initAudio(){
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 startBgm();
}
function tone(freq,dur=.12,type="sine",vol=.13){
 if(!sfxOn||!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.value=freq;g.gain.value=vol;
 o.connect(g);g.connect(audioCtx.destination);o.start();
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
 o.stop(audioCtx.currentTime+dur);
}
function tapSound(){tone(520,.05,"square",.08)}
function okSound(){tone(660,.11,"square",.11);setTimeout(()=>tone(880,.18,"square",.12),90)}
function ngSound(){tone(150,.25,"sawtooth",.11)}
function coinSound(){tone(880,.08,"square",.1);setTimeout(()=>tone(1175,.14,"square",.11),75)}
function startBgm(){
 if(!bgmOn||!audioCtx||bgmTimer)return;
 const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23];
 let i=0;
 bgmTimer=setInterval(()=>{
   if(!bgmOn)return;
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type="triangle";o.frequency.value=notes[i++%notes.length];g.gain.value=.09;
   o.connect(g);g.connect(audioCtx.destination);o.start();
   g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.28);
   o.stop(audioCtx.currentTime+.28);
 },320);
}
function stopBgm(){clearInterval(bgmTimer);bgmTimer=null}

function updateHud(){
 $("money").textContent=money.toLocaleString();
 $("level").textContent=level;
 $("combo").textContent=combo;
}
function openSheet(){ $("sheet").classList.add("open") }
function closeSheet(){ $("sheet").classList.remove("open") }

function newCustomer(){
 state="ready";
 current=jobs[Math.floor(Math.random()*jobs.length)];
 $("status").textContent="来店中";
 $("customer").style.display="block";
 $("hint").textContent="お客様に話すか、受付をタップ";
 $("talkBtn").disabled=false;
 closeSheet();
}
function showQuestion(){
 if(state==="repairing")return;
 tapSound();
 state="question";
 $("sheetTitle").textContent=`${current.device} の修理依頼`;
 $("sheetText").innerHTML=`症状：<b>${current.symptom}</b><br>正しい対応を選んでください。`;
 $("result").textContent="";
 $("result").className="";
 $("progressWrap").style.display="none";
 $("nextBtn").style.display="none";
 const wrap=$("choices");wrap.innerHTML="";
 current.choices.forEach(c=>{
   const b=document.createElement("button");
   b.className="choice";b.textContent=c;
   b.onclick=()=>answer(c);
   wrap.appendChild(b);
 });
 openSheet();
}
function answer(choice){
 if(state!=="question")return;
 tapSound();
 [...$("choices").children].forEach(b=>b.disabled=true);
 if(choice===current.answer){
   combo++;
   $("result").className="good";
   $("result").textContent="✅ 正解！ 修理を開始します";
   okSound();
   repair();
 }else{
   combo=0;state="answered";
   $("result").className="bad";
   $("result").textContent=`❌ 不正解　正解は「${current.answer}」`;
   ngSound();updateHud();
   $("nextBtn").style.display="block";
 }
}
function repair(){
 state="repairing";
 $("status").textContent="修理中";
 $("progressWrap").style.display="block";
 $("progress").style.width="0";
 let start=performance.now();
 function frame(now){
   const r=Math.min(1,(now-start)/1800);
   $("progress").style.width=(r*100)+"%";
   if(r<1)requestAnimationFrame(frame);else finish();
 }
 requestAnimationFrame(frame);
}
function finish(){
 state="done";
 money+=current.price;cleared++;level=1+Math.floor(cleared/3);
 $("status").textContent="修理完了";
 $("result").className="good";
 $("result").textContent=`🎉 修理完了！ +${current.price.toLocaleString()}円`;
 coinSound();updateHud();
 $("nextBtn").style.display="block";
 $("talkBtn").disabled=true;
}
function nextCustomer(){
 tapSound();newCustomer();
}

function clampPlayer(x,y){
 const world=$("world"),p=$("player");
 const maxX=world.clientWidth-p.offsetWidth;
 const maxY=world.clientHeight-p.offsetHeight-26;
 return {x:Math.max(0,Math.min(maxX,x)),y:Math.max(0,Math.min(maxY,y))};
}
function movePlayer(x,y){
 const pos=clampPlayer(x,y);
 $("player").style.left=pos.x+"px";
 $("player").style.top=pos.y+"px";
}
$("player").addEventListener("pointerdown",e=>{
 dragging=true;$("player").setPointerCapture(e.pointerId);
 const r=$("player").getBoundingClientRect();
 offsetX=e.clientX-r.left;offsetY=e.clientY-r.top;
 tapSound();
});
$("player").addEventListener("pointermove",e=>{
 if(!dragging)return;
 const w=$("world").getBoundingClientRect();
 movePlayer(e.clientX-w.left-offsetX,e.clientY-w.top-offsetY);
});
$("player").addEventListener("pointerup",()=>dragging=false);
$("player").addEventListener("pointercancel",()=>dragging=false);

$("startBtn").onclick=()=>{initAudio();tapSound();$("gate").style.display="none";newCustomer()};
$("talkBtn").onclick=showQuestion;
$("counter").onclick=showQuestion;
$("customer").onclick=showQuestion;
$("parts").onclick=()=>{tapSound();$("hint").textContent="パーツ棚：在庫機能は次回追加予定"};
$("desk").onclick=()=>{tapSound();$("hint").textContent=state==="repairing"?"修理中です":"まずお客様の依頼を確認してください"};
$("centerBtn").onclick=()=>{tapSound();movePlayer($("world").clientWidth*.44,$("world").clientHeight*.52)};
$("closeSheet").onclick=()=>{tapSound();closeSheet()};
$("nextBtn").onclick=nextCustomer;
$("bgmBtn").onclick=()=>{tapSound();bgmOn=!bgmOn;$("bgmBtn").classList.toggle("off",!bgmOn);bgmOn?startBgm():stopBgm()};
$("sfxBtn").onclick=()=>{sfxOn=!sfxOn;$("sfxBtn").classList.toggle("off",!sfxOn);if(sfxOn)tapSound()};

window.addEventListener("resize",()=>{
 const p=$("player");
 movePlayer(parseFloat(p.style.left)||$("world").clientWidth*.44,parseFloat(p.style.top)||$("world").clientHeight*.52);
});
updateHud();
</script>
</body>
</html>
