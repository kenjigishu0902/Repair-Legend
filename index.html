<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repair Legend</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

<div id="hud">
<div class="badge">💰 <span id="money">0</span>円</div>
<div class="badge">⭐ Lv.<span id="level">1</span></div>
<div class="badge">🔥 <span id="combo">0</span></div>

<div id="status" class="badge">
待機中
</div>

<button id="bgmBtn">🎵</button>
<button id="sfxBtn">🔊</button>

</div>

<div id="world">

<div class="sign">
REPAIR LEGEND
</div>

<div id="counter">
受付
</div>

<div id="parts">
パーツ棚
</div>

<div id="desk">
修理台
</div>

<img id="player" src="assets/feni.png">

<div id="customer"></div>

<div id="speech" class="hidden">

<strong id="speechTitle"></strong>

<p id="speechText"></p>

<button id="acceptBtn">
受付する
</button>

</div>

<div id="hint">
ゲーム開始を押してください
</div>

</div>

<div id="questionWindow" class="hidden">

<h2 id="deviceName"></h2>

<p id="symptom"></p>

<div id="choices"></div>

<div id="result"></div>

<div id="progressWrap">
<div id="progress"></div>
</div>

<button id="nextBtn">
次のお客様へ
</button>

</div>

<div id="startScreen">

<h1>
Repair Legend
</h1>

<p>
スマホ修理シミュレーター
</p>

<button id="startButton">
ゲーム開始
</button>

</div>

</div>

<script src="questions.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>

</body>
</html>
