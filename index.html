<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Repair Legend v0.2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111}
button{font:inherit}
#game{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:linear-gradient(#f2eee7 0 70%,#ceb99f 70% 100%);
}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:30}
.badge{background:#fff;padding:8px 10px;border-radius:12px;font-weight:900;box-shadow:0 3px 10px #0003;font-size:14px}
#status{margin-left:auto;background:#222;color:#fff}
.ctrl{border:0;background:#fff;padding:8px 10px;border-radius:12px;font-weight:900;box-shadow:0 3px 10px #0003}
.ctrl.off{opacity:.45}
#shop{position:absolute;inset:64px 0 230px 0}
.sign{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#b92025;color:#fff;padding:8px 16px;border-radius:9px;font-weight:1000}
.station{position:absolute;color:#fff;font-weight:1000;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px #0004}
#counter{left:5vw;top:25%;width:35vw;height:80px;background:#825126}
#parts{right:5vw;top:25%;width:30vw;height:75px;background:#28637f}
#desk{right:8vw;top:58%;width:38vw;height:90px;background:#555}
#customer{
 position:absolute;left:8vw;top:56%;width:82px;height:112px;border-radius:40px 40px 15px 15px;
 background:linear-gradient(#66afff 0 36%,#efc49e 36% 61%,#314f83 61%);
 box-shadow:0 8px 16px #0004;display:none
}
#customer:after{content:"お客様";position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;white-space:nowrap}
#player{position:absolute;width:130px;left:42%;top:54%;filter:drop-shadow(0 10px 7px #0004)}
#panel{
 position:absolute;left:8px;right:8px;bottom:8px;min-height:205px;max-height:45vh;overflow:auto;
 background:#1f1f1ff2;color:#fff;border-radius:17px;padding:14px;z-index:40;box-shadow:0 10px 26px #0006
}
#title{font-size:19px;font-weight:1000;margin-bottom:7px}
#text{font-size:14px;line-height:1.5;color:#eee}
#choices{margin-top:10px}
.choice,.mainBtn{
 width:100%;border:0;border-radius:11px;padding:12px;margin-top:8px;font-weight:900
}
.choice{background:#fff;color:#111;text-align:left}
.mainBtn{background:#ffb000;color:#111}
.mainBtn.secondary{background:#fff}
#result{margin-top:10px;font-size:18px;font-weight:1000}
.good{color:#77e889}.bad{color:#ff7777}
#progressWrap{height:12px;background:#555;border-radius:999px;overflow:hidden;margin-top:12px;display:none}
#progress{height:100%;width:0;background:#ffb000}
#soundGate{
 position:absolute;inset:0;background:#000b;color:#fff;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center
}
#soundGate button{border:0;background:#ffb000;padding:14px 22px;border-radius:14px;font-weight:1000;font-size:18px}
</style>
</head>
<body>
<div id="game">
  <div id="top">
    <div class="badge">💰 <span id="money">0</span>円</div>
    <div class="badge">⭐ Lv.<span id="level">1</span></div>
    <div class="badge">🔥 <span id="combo">0</span>コンボ</div>
    <div id="status" class="badge">待機中</div>
    <button id="bgmBtn" class="ctrl">🎵 BGM</button>
    <button id="sfxBtn" class="ctrl">🔊 効果音</button>
  </div>

  <div id="shop">
    <div class="sign">REPAIR LEGEND</div>
    <div id="counter" class="station">受付</div>
    <div id="parts" class="station">パーツ棚</div>
    <div id="desk" class="station">修理台</div>
    <div id="customer"></div>
    <img id="player" src="feni.png" alt="フェニちゃん">
  </div>

  <div id="panel">
    <div id="title">ゲーム開始前</div>
    <div id="text">画面をタップして音を有効にしてください。</div>
    <div id="choices"></div>
    <div id="result"></div>
    <div id="progressWrap"><div id="progress"></div></div>
    <button id="mainBtn" class="mainBtn" style="display:none"></button>
  </div>

  <div id="soundGate">
    <button id="startBtn">タップしてゲーム開始 🔊</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const jobs=[
 {device:"iPhone 13",symptom:"バッテリーの減りが早い",answer:"バッテリー交換",choices:["画面交換","バッテリー交換","ドック交換"],price:10800},
 {device:"iPhone 11",symptom:"画面が真っ暗だが着信音は鳴る",answer:"画面交換",choices:["画面交換","バッテリー交換","カメラ交換"],price:9800},
 {device:"Pixel 7",symptom:"背面が浮き、バッテリーが膨張している",answer:"バッテリー交換",choices:["背面交換","バッテリー交換","スピーカー交換"],price:12800},
 {device:"Galaxy S23 Ultra",symptom:"画面割れとタッチ不良",answer:"画面交換",choices:["画面交換","充電口交換","基板洗浄"],price:49700},
 {device:"Nintendo Switch",symptom:"ゲームカードを読み込まない",answer:"ゲームカードスロット交換",choices:["SDスロット交換","ゲームカードスロット交換","液晶交換"],price:14800},
 {device:"AQUOS wish2",symptom:"電源は入っているが画面だけ映らない",answer:"画面交換",choices:["画面交換","バイブ交換","SIM交換"],price:15800},
 {device:"iPhone SE2",symptom:"指紋認証は使えるがホームボタンを押しても反応しない",answer:"ホームボタン周辺の確認",choices:["ホームボタン周辺の確認","バッテリー交換","カメラ交換"],price:7800},
 {device:"iPhone 15",symptom:"ケーブルを挿しても充電反応がない",answer:"ドックコネクタ診断",choices:["ドックコネクタ診断","画面交換","近接センサー交換"],price:16800},
 {device:"Switch 有機EL",symptom:"TV出力はできるが本体画面だけ真っ黒",answer:"液晶・表示系統の確認",choices:["液晶・表示系統の確認","Joy-Con交換","Wi-Fi修理"],price:26000},
 {device:"iPhone 13 Pro Max",symptom:"落下後に緑色の線が表示される",answer:"画面交換",choices:["画面交換","スピーカー交換","バッテリー交換"],price:29800}
];

let money=0,level=1,combo=0,cleared=0,current=null,state="idle";
let audioCtx,bgmTimer,bgmOn=true,sfxOn=true;

function initAudio(){
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 startBgm();
}
function tone(freq,dur=.12,type="sine",vol=.12){
 if(!sfxOn||!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.value=freq;g.gain.value=vol;
 o.connect(g);g.connect(audioCtx.destination);o.start();
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
 o.stop(audioCtx.currentTime+dur);
}
function tapSound(){tone(520,.06,"square",.08)}
function okSound(){tone(660,.12,"square",.1);setTimeout(()=>tone(880,.18,"square",.11),100)}
function ngSound(){tone(160,.24,"sawtooth",.1)}
function coinSound(){tone(880,.08,"square",.09);setTimeout(()=>tone(1175,.14,"square",.1),80)}
function startBgm(){
 if(!bgmOn||!audioCtx||bgmTimer)return;
 const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23];
 let i=0;
 bgmTimer=setInterval(()=>{
   if(!bgmOn)return;
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type="triangle";o.frequency.value=notes[i++%notes.length];g.gain.value=.07;
   o.connect(g);g.connect(audioCtx.destination);o.start();
   g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.28);
   o.stop(audioCtx.currentTime+.28);
 },320);
}
function stopBgm(){clearInterval(bgmTimer);bgmTimer=null}

$("startBtn").onclick=()=>{
 initAudio();tapSound();$("soundGate").style.display="none";newCustomer();
};
$("bgmBtn").onclick=()=>{
 tapSound();bgmOn=!bgmOn;$("bgmBtn").classList.toggle("off",!bgmOn);bgmOn?startBgm():stopBgm();
};
$("sfxBtn").onclick=()=>{
 sfxOn=!sfxOn;$("sfxBtn").classList.toggle("off",!sfxOn);if(sfxOn)tapSound();
};

function ui(){
 $("money").textContent=money.toLocaleString();
 $("level").textContent=level;
 $("combo").textContent=combo;
}
function newCustomer(){
 state="question";current=jobs[Math.floor(Math.random()*jobs.length)];
 $("customer").style.display="block";
 $("status").textContent="来店中";
 $("title").textContent=`${current.device} の修理依頼`;
 $("text").innerHTML=`症状：<b>${current.symptom}</b><br>正しい対応を選んでください。`;
 $("result").textContent="";
 $("mainBtn").style.display="none";
 $("progressWrap").style.display="none";
 const wrap=$("choices");wrap.innerHTML="";
 current.choices.forEach(c=>{
   const b=document.createElement("button");b.className="choice";b.textContent=c;
   b.onclick=()=>answer(c,b);wrap.appendChild(b);
 });
 tone(540,.1,"sine",.08);
}
function answer(choice,btn){
 if(state!=="question")return;
 tapSound();state="answered";
 [...$("choices").children].forEach(b=>b.disabled=true);
 if(choice===current.answer){
   combo++;$("result").className="good";$("result").textContent="✅ 正解！";
   okSound();repair();
 }else{
   combo=0;$("result").className="bad";
   $("result").textContent=`❌ 不正解　正解は「${current.answer}」`;
   ngSound();
   $("mainBtn").textContent="次のお客様へ";
   $("mainBtn").style.display="block";
   $("mainBtn").onclick=()=>{tapSound();newCustomer()};
   ui();
 }
}
function repair(){
 $("status").textContent="修理中";
 $("progressWrap").style.display="block";
 const p=$("progress");p.style.width="0";
 let start=performance.now();
 function frame(now){
   const r=Math.min(1,(now-start)/1800);p.style.width=(r*100)+"%";
   if(r<1)requestAnimationFrame(frame);else finish();
 }
 requestAnimationFrame(frame);
}
function finish(){
 money+=current.price;cleared++;level=1+Math.floor(cleared/3);
 $("status").textContent="修理完了";
 $("result").className="good";
 $("result").textContent=`🎉 修理完了！ +${current.price.toLocaleString()}円`;
 coinSound();ui();
 $("mainBtn").textContent="次のお客様へ";
 $("mainBtn").style.display="block";
 $("mainBtn").onclick=()=>{tapSound();newCustomer()};
}
ui();
</script>
</body>
</html>
