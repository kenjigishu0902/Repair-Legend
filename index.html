<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repair Legend</title>
<style>
:root{--bg:#080b12;--panel:#131925;--panel2:#1b2433;--line:#303b4d;--red:#e5484d;--gold:#f2c14e;--text:#f7f8fa;--muted:#aeb7c5;--good:#41c787;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182030 0,#080b12 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;min-height:100vh}.app{max-width:780px;margin:auto;padding:18px 16px 40px}.title{text-align:center;letter-spacing:.08em;margin:8px 0 4px;font-size:30px}.sub{text-align:center;color:var(--muted);margin:0 0 16px}.pheniCard{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:12px;background:#0e1420;border:1px solid var(--line);border-radius:16px}.pheniCard img{width:92px;height:92px;object-fit:contain;border-radius:14px}.pheniCard b{display:block;color:var(--gold);font-size:18px;margin-bottom:4px}.pheniCard span{color:var(--muted);line-height:1.5}.voiceRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin:10px 0}.voiceRow label{font-size:13px;color:var(--muted)}.voiceRow select{width:100%;margin-top:5px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#101722;color:var(--text)}.miniBtn{border:0;border-radius:10px;padding:11px 12px;background:#263247;color:#fff;font-weight:700}.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 16px 50px rgba(0,0,0,.28)}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#0e1420;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:19px;color:var(--gold)}h2,h3{margin:8px 0 12px}.girls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.girl{border:1px solid var(--line);background:#101722;border-radius:16px;padding:12px;text-align:center;cursor:pointer;color:var(--text)}.girl.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,193,78,.2)}.avatar{font-size:48px;display:block;margin-bottom:6px}.girl small{display:block;color:var(--muted);margin-top:5px}.btn{width:100%;border:0;border-radius:12px;padding:14px 12px;margin:6px 0;background:#263247;color:#fff;font-size:16px;font-weight:700}.btn:active{transform:scale(.99)}.btn.primary{background:linear-gradient(180deg,#f15459,#c72f35)}.btn.gold{background:linear-gradient(180deg,#f4c95d,#c79625);color:#201600}.btn.good{background:#198754}.btn.danger{background:#9e2f36}.speech{background:#0d131d;border-left:4px solid var(--gold);padding:14px;border-radius:10px;margin:12px 0;line-height:1.65}.customer{font-size:18px}.log{background:#090d14;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:76px;line-height:1.6;color:#dbe1ea}.sectionLabel{font-size:13px;color:var(--muted);letter-spacing:.08em;margin:16px 0 5px}.questionGrid,.diagnosisGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.questionGrid button,.diagnosisGrid button{margin:0}.used{opacity:.45}.result{padding:14px;border-radius:12px;margin-top:12px;line-height:1.6}.result.ok{background:rgba(65,199,135,.12);border:1px solid var(--good)}.result.ng{background:rgba(255,107,107,.12);border:1px solid var(--bad)}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}.toggle{display:flex;align-items:center;gap:8px;justify-content:center;margin:12px 0;color:var(--muted)}input{accent-color:var(--red)}@media(max-width:560px){.girls{grid-template-columns:1fr}.girl{display:grid;grid-template-columns:58px 1fr;text-align:left;align-items:center}.girl .avatar{grid-row:1/3}.status{grid-template-columns:repeat(2,1fr)}.questionGrid,.diagnosisGrid{grid-template-columns:1fr}.title{font-size:26px}}
</style>
</head>

let selected=null,current=null,asked=[],caseNo=0,trust=100,sales=0,streak=0,locked=false,lastIndex=-1;
const $=id=>document.getElementById(id);
let availableVoices=[];
function loadVoices(){
  if(!('speechSynthesis' in window))return;
  availableVoices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'));
  const sel=$('voiceSelect');
  if(!sel)return;
  const keep=sel.value;
  sel.innerHTML='<option value="">自動で一番自然な日本語音声</option>';
  availableVoices.forEach((v,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=v.name+(v.localService?'':'（オンライン）');sel.appendChild(o)});
  if(keep)sel.value=keep;
}
function bestVoice(){
  const sel=$('voiceSelect');
  if(sel&&sel.value!==''&&availableVoices[Number(sel.value)])return availableVoices[Number(sel.value)];
  const priority=['O-ren','Kyoko','Hattori','Haruka','Nanami','Siri','Japanese'];
  return priority.map(n=>availableVoices.find(v=>v.name.includes(n))).find(Boolean)||availableVoices[0]||null;
}
function naturalize(text){return text.replace(/。/g,'。 ').replace(/！/g,'！ ').replace(/、/g,'、 ')}
function speak(text,rate=.93){
  if(!$('voiceToggle').checked||!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(naturalize(text));
  u.lang='ja-JP';
  u.rate=Math.max(.82,Math.min(1.02,rate));
  u.pitch=selected?.id==='mio'?1.04:selected?.id==='rei'?.96:1.0;
  u.volume=1;
  u.voice=bestVoice();
  speechSynthesis.speak(u)
}
function renderGirls(){const box=$('girls');girls.forEach(g=>{const b=document.createElement('button');b.className='girl';b.innerHTML=`<span class="avatar">${g.icon}</span><b>${g.name}</b><small>${g.desc}</small>`;b.addEventListener('click',()=>{selected=g;document.querySelectorAll('.girl').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('startBtn').disabled=false;$('startBtn').textContent=`${g.name}とゲーム開始`;speak(g.select)});box.appendChild(b)})}
function startGame(){if(!selected)return;$('pheniLine').textContent='さあ始めるぞ。耳を澄ませ、原因を見抜け！';$('selectScreen').classList.add('hidden');$('gameScreen').classList.remove('hidden');speak(selected.start,.95);setTimeout(nextCase,900)}
function nextCase(){locked=false;asked=[];caseNo++;let idx;do{idx=Math.floor(Math.random()*cases.length)}while(cases.length>1&&idx===lastIndex);lastIndex=idx;current=cases[idx];$('caseNo').textContent=caseNo;$('caseTitle').textContent=current.title;$('customerText').innerHTML=`<b>お客様</b><br>「${current.customer}」`;$('assistantText').innerHTML=`<b>${selected.name}</b><br>「まずは質問して、修理判断の根拠を集めましょう。」`;$('log').textContent='まだ情報がありません。';$('result').innerHTML='';$('nextBtn').classList.add('hidden');renderQuestions();renderDiagnoses();speak(`ケース${caseNo}。${current.title}。お客様からの相談です。${current.customer}`,.92)}
function renderQuestions(){const box=$('questions');box.innerHTML='';current.questions.forEach((q,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=q[0];b.addEventListener('click',()=>ask(i,b));box.appendChild(b)})}
function ask(i,b){if(locked||asked.includes(i))return;asked.push(i);b.classList.add('used');const lines=asked.map(n=>`・${current.questions[n][1]}`);$('log').innerHTML=lines.join('<br>');speak(current.questions[i][1],1)}
function renderDiagnoses(){const box=$('diagnoses');box.innerHTML='';current.diagnoses.forEach((d,i)=>{const b=document.createElement('button');b.className='btn danger';b.textContent=d;b.addEventListener('click',()=>judge(i));box.appendChild(b)})}
function judge(i){if(locked)return;locked=true;const enough=current.required.every(n=>asked.includes(n));const correct=i===current.correct&&enough;const partial=i===current.correct&&!enough;let msg='';if(correct){$('pheniLine').textContent=['見事だ！その診断、まさに伝説級！','よく聞き、よく見抜いたな！','修理成功！次の依頼も任せたぞ！'][Math.floor(Math.random()*3)];streak++;trust=Math.min(100,trust+2);sales+=current.price;msg=`<div class="result ok"><b>✅ 修理成功</b><br>${current.explain}<br><br>売上：¥${current.price.toLocaleString('ja-JP')}</div>`;speak(selected.correct[Math.floor(Math.random()*selected.correct.length)])}else{$('pheniLine').textContent=['焦るな。答えはお客様の言葉の中にある。','誤診は終わりではない。次に活かせ！','確認不足だ。もう一度、症状を組み立てろ。'][Math.floor(Math.random()*3)];streak=0;trust=Math.max(0,trust-(partial?5:12));msg=`<div class="result ng"><b>❌ ${partial?'ヒアリング不足':'誤診'}</b><br>${partial?'判断方向は合っていますが、必要な確認が不足しています。':'選んだ修理内容は症状と一致しません。'}<br><br><b>正解：</b>${current.diagnoses[current.correct]}<br>${current.explain}</div>`;speak(selected.wrong[Math.floor(Math.random()*selected.wrong.length)])}$('result').innerHTML=msg;$('trust').textContent=trust;$('sales').textContent='¥'+sales.toLocaleString('ja-JP');$('streak').textContent=streak;$('nextBtn').classList.remove('hidden');document.querySelectorAll('#questions button,#diagnoses button').forEach(b=>b.disabled=true)}
renderGirls();loadVoices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=loadVoices;$('voiceTest').addEventListener('click',()=>speak('こんにちは。受付アシスタントです。お客様のお困りごとを、丁寧に確認しましょう。',.9));$('startBtn').addEventListener('click',startGame);$('nextBtn').addEventListener('click',nextCase);speechSynthesis?.getVoices?.();
</script>
