<!DOCTYPE html><html lang='ja'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Repair Legend</title></head><body style='margin:0;font-family:sans-serif'><div id='game' style='position:relative;width:100vw;height:100vh;background:#f4efe6'><img id='player' src='feni.png' style='position:absolute;width:150px;left:45%;top:60%'><div style='position:absolute;top:10px;left:10px;background:#fff;padding:10px'>💰<span id='m'>0</span>円</div><script>let p=document.getElementById('player'),x=innerWidth*.45,y=innerHeight*.6,tx=x,ty=y;game.onclick=e=>{tx=e.clientX-75;ty=e.clientY-75};function a(){x+=(tx-x)*.12;y+=(ty-y)*.12;p.style.left=x+'px';p.style.top=y+'px';requestAnimationFrame(a)}a();</script></div></body></html>
