<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Repair Legend v0.4</title>
<style>
:root{--gold:#ffb000;--red:#c9202c;--panel:#171717f4}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;touch-action:manipulation}#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#f4f0e8 0 72%,#d0b898 72% 100%);user-select:none}#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:50}.badge,.soundBtn{background:#fff;border:0;border-radius:12px;padding:8px 10px;font-weight:900;font-size:14px;box-shadow:0 3px 10px #0003}#status{margin-left:auto;background:#222;color:#fff}.soundBtn.off{opacity:.45}#world{position:absolute;left:0;right:0;top:62px;bottom:78px;overflow:hidden}.sign{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:8px 17px;border-radius:9px;font-weight:1000}.station{position:absolute;color:#fff;font-weight:1000;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px #0004}#counter{left:5vw;top:22%;width:34vw;height:74px;background:#8e5827}#parts{right:5vw;top:22%;width:29vw;height:74px;background:#2e6f8d}#desk{right:8vw;top:58%;width:38vw;height:82px;background:#5d5d5d}#player{position:absolute;width:112px;left:45%;top:53%;z-index:8;filter:drop-shadow(0 10px 7px #0004)}#customer{position:absolute;width:74px;height:104px;left:-90px;top:56%;border-radius:38px 38px 14px 14px;background:linear-gradient(#69aff4 0 36%,#efc49e 36% 61%,#314f83 61%);box-shadow:0 8px 16px #0004;z-index:7;transition:left 1.25s ease,opacity .5s ease}#customer::after{content:"お客様";position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;white-space:nowrap;color:#111}#customer.happy{background:linear-gradient(#7bd67b 0 36%,#efc49e 36% 61%,#314f83 61%)}#bubble{position:absolute;display:none;z-index:20;min-width:210px;max-width:320px;background:#fff;color:#111;border-radius:18px;padding:13px 15px;box-shadow:0 8px 24px #0004;font-weight:800;line-height:1.45}#bubble::after{content:"";position:absolute;bottom:-14px;left:36px;border:8px solid transparent;border-top-color:#fff}#bubbleTitle{font-size:16px;font-weight:1000;margin-bottom:5px}#acceptBtn{width:100%;border:0;border-radius:11px;padding:10px;margin-top:10px;background:var(--gold);font-weight:1000}#sheet{position:absolute;left:8px;right:8px;bottom:80px;z-index:60;background:var(--panel);color:#fff;border-radius:18px;padding:14px;box-shadow:0 12px 30px #0007;max-height:44dvh;overflow:auto;transform:translateY(calc(100% + 95px));transition:transform .25s ease}#sheet.open{transform:translateY(0)}#sheetHead{display:flex;align-items:center;gap:8px}#sheetTitle{font-size:18px;font-weight:1000;flex:1}#closeSheet{border:0;background:#fff;color:#111;border-radius:10px;padding:7px 10px;font-weight:900}#sheetText{margin-top:7px;line-height:1.45;font-size:14px;color:#eee}.choice{width:100%;border:0;border-radius:11px;padding:11px;margin-top:7px;background:#fff;color:#111;text-align:left;font-weight:900}#result{margin-top:10px;font-size:17px;font-weight:1000}.good{color:#78e78a}.bad{color:#ff7777}#progressWrap{display:none;height:12px;background:#555;border-radius:999px;overflow:hidden;margin-top:12px}#progress{height:100%;width:0;background:var(--gold)}#nextBtn{display:none;width:100%;border:0;border-radius:12px;padding:12px;margin-top:10px;background:var(--gold);font-weight:1000}#hint{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:8px 13px;font-weight:900;font-size:13px;box-shadow:0 4px 14px #0003;z-index:12;white-space:nowrap}#gate{position:absolute;inset:0;z-index:100;background:#000c;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}#gate h1{font-size:28px;margin-bottom:8px}#gate p{line-height:1.5;margin-bottom:16px}#startBtn{border:0;background:var(--gold);padding:14px 20px;border-radius:14px;font-size:18px;font-weight:1000}@media(max-width:700px){#world{top:104px;bottom:78px}#counter{left:4vw;top:18%;width:42vw;height:64px}#parts{right:4vw;top:18%;width:38vw;height:64px}#desk{right:5vw;top:60%;width:48vw;height:72px}#player{width:92px;left:43%;top:52%}#customer{width:62px;height:90px;top:60%}#bubble{min-width:185px;max-width:250px;font-size:13px}#sheet{bottom:78px;max-height:48dvh}}
</style>
</head>
<body>
<div id="game">
<div id="hud"><div class="badge">💰 <span id="money">0</span>円</div><div class="badge">⭐ Lv.<span id="level">1</span></div><div class="badge">🔥 <span id="combo">0</span>コンボ</div><div id="status" class="badge">待機中</div><button id="bgmBtn" class="soundBtn">🎵 BGM</button><button id="sfxBtn" class="soundBtn">🔊 効果音</button></div>
<div id="world"><div class="sign">REPAIR LEGEND</div><div id="counter" class="station">受付</div><div id="parts" class="station">パーツ棚</div><div id="desk" class="station">修理台</div><img id="player" src="feni.png" alt="フェニちゃん"><div id="customer"></div><div id="bubble"><div id="bubbleTitle">お客様</div><div id="bubbleText"></div><button id="acceptBtn">受付する</button></div><div id="hint">まもなくお客様が来店します</div></div>
<div id="sheet"><div id="sheetHead"><div id="sheetTitle">修理依頼</div><button id="closeSheet">閉じる</button></div><div id="sheetText"></div><div id="choices"></div><div id="result"></div><div id="progressWrap"><div id="progress"></div></div><button id="nextBtn">完了</button></div>
<div id="gate"><div><h1>Repair Legend v0.4</h1><p>お客様がフェニちゃんの近くまで歩いてきます。<br>1人終わると次のお客様が来店します。</p><button id="startBtn">ゲーム開始 🔊</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);const jobs=[{device:"iPhone 13",symptom:"バッテリーの減りが早くて困っています。",answer:"バッテリー交換",choices:["画面交換","バッテリー交換","ドック交換"],price:10800},{device:"iPhone 11",symptom:"音は鳴るのに画面が真っ暗です。",answer:"画面交換",choices:["画面交換","バッテリー交換","カメラ交換"],price:9800},{device:"Pixel 7",symptom:"背面が浮いてきました。",answer:"バッテリー交換",choices:["背面交換","バッテリー交換","スピーカー交換"],price:12800},{device:"Galaxy S23 Ultra",symptom:"画面が割れてタッチも効きません。",answer:"画面交換",choices:["画面交換","充電口交換","基板洗浄"],price:49700},{device:"Nintendo Switch",symptom:"ゲームカードを読み込みません。",answer:"ゲームカードスロット交換",choices:["SDスロット交換","ゲームカードスロット交換","液晶交換"],price:14800},{device:"AQUOS wish2",symptom:"電源は入るのに画面だけ映りません。",answer:"画面交換",choices:["画面交換","バイブ交換","SIM交換"],price:15800},{device:"iPhone SE2",symptom:"指紋は使えるのにホームボタンを押しても反応しません。",answer:"ホームボタン周辺の確認",choices:["ホームボタン周辺の確認","バッテリー交換","カメラ交換"],price:7800},{device:"iPhone 15",symptom:"ケーブルを挿しても充電できません。",answer:"ドックコネクタ診断",choices:["ドックコネクタ診断","画面交換","近接センサー交換"],price:16800}];
let current,state="idle",money=0,level=1,combo=0,cleared=0,audioCtx,bgmTimer,bgmOn=true,sfxOn=true;
function initAudio(){audioCtx=new(window.AudioContext||window.webkitAudioContext)();startBgm()}function tone(f,d=.12,t="sine",v=.12){if(!sfxOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}function tapSound(){tone(520,.05,"square",.08)}function arriveSound(){tone(440,.09,"sine",.09);setTimeout(()=>tone(660,.12,"sine",.1),90)}function okSound(){tone(660,.11,"square",.11);setTimeout(()=>tone(880,.18,"square",.12),90)}function ngSound(){tone(150,.25,"sawtooth",.11)}function coinSound(){tone(880,.08,"square",.1);setTimeout(()=>tone(1175,.14,"square",.11),75)}function startBgm(){if(!bgmOn||!audioCtx||bgmTimer)return;const n=[261.63,329.63,392,523.25,392,329.63,293.66,349.23];let i=0;bgmTimer=setInterval(()=>{if(!bgmOn)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.value=n[i++%n.length];g.gain.value=.08;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.28);o.stop(audioCtx.currentTime+.28)},320)}function stopBgm(){clearInterval(bgmTimer);bgmTimer=null}function updateHud(){$("money").textContent=money.toLocaleString();$("level").textContent=level;$("combo").textContent=combo}function openSheet(){$("sheet").classList.add("open")}function closeSheet(){$("sheet").classList.remove("open")}
function positionBubble(){const p=$("player").getBoundingClientRect(),w=$("world").getBoundingClientRect(),b=$("bubble");let l=p.left-w.left-105,t=p.top-w.top-120;l=Math.max(8,Math.min(w.width-b.offsetWidth-8,l));t=Math.max(8,t);b.style.left=l+"px";b.style.top=t+"px"}
function sendCustomerIn(){state="arriving";closeSheet();$("bubble").style.display="none";$("customer").classList.remove("happy");current=jobs[Math.floor(Math.random()*jobs.length)];$("status").textContent="来店中";$("hint").textContent="お客様が近づいています";$("customer").style.opacity="1";$("customer").style.left="-90px";requestAnimationFrame(()=>requestAnimationFrame(()=>{const x=$("player").offsetLeft;$("customer").style.left=Math.max(15,x-$("customer").offsetWidth-20)+"px"}));setTimeout(()=>{if(state!=="arriving")return;state="talking";arriveSound();showBubble()},1350)}
function showBubble(){$("bubbleTitle").textContent=current.device+"のお客様";$("bubbleText").textContent="「"+current.symptom+"」";$("acceptBtn").style.display="block";$("bubble").style.display="block";requestAnimationFrame(positionBubble);$("hint").textContent="吹き出しの『受付する』をタップ"}
function showQuestion(){tapSound();state="question";$("bubble").style.display="none";$("sheetTitle").textContent=current.device+" の修理依頼";$("sheetText").innerHTML="症状：<b>"+current.symptom+"</b><br>正しい対応を選んでください。";$("result").textContent="";$("progressWrap").style.display="none";$("nextBtn").style.display="none";const w=$("choices");w.innerHTML="";current.choices.forEach(c=>{const b=document.createElement("button");b.className="choice";b.textContent=c;b.onclick=()=>answer(c);w.appendChild(b)});openSheet();$("hint").textContent="正しい修理内容を選択"}
function answer(c){if(state!=="question")return;tapSound();[...$("choices").children].forEach(b=>b.disabled=true);if(c===current.answer){combo++;$("result").className="good";$("result").textContent="✅ 正解！ 修理開始";okSound();repair()}else{combo=0;state="answered";$("result").className="bad";$("result").textContent="❌ 不正解　正解は『"+current.answer+"』";ngSound();updateHud();$("nextBtn").style.display="block";$("nextBtn").textContent="次のお客様へ"}}
function repair(){state="repairing";$("status").textContent="修理中";$("progressWrap").style.display="block";$("progress").style.width="0";let s=performance.now();function f(n){const r=Math.min(1,(n-s)/1800);$("progress").style.width=r*100+"%";if(r<1)requestAnimationFrame(f);else finish()}requestAnimationFrame(f)}
function finish(){state="done";money+=current.price;cleared++;level=1+Math.floor(cleared/3);$("status").textContent="修理完了";$("result").className="good";$("result").textContent="🎉 修理完了！ +"+current.price.toLocaleString()+"円";coinSound();updateHud();$("nextBtn").style.display="block";$("nextBtn").textContent="お客様をお見送り"}
function sendCustomerOut(){tapSound();closeSheet();$("customer").classList.add("happy");$("bubbleTitle").textContent="お客様";$("bubbleText").textContent="『直りました！ありがとうございます！』";$("acceptBtn").style.display="none";$("bubble").style.display="block";positionBubble();$("hint").textContent="お客様がお帰りになります";$("status").textContent="お見送り";setTimeout(()=>{$("bubble").style.display="none";$("customer").style.left=window.innerWidth+100+"px";$("customer").style.opacity="0"},1000);setTimeout(sendCustomerIn,2300)}
$("startBtn").onclick=()=>{initAudio();tapSound();$("gate").style.display="none";setTimeout(sendCustomerIn,500)};$("acceptBtn").onclick=showQuestion;$("nextBtn").onclick=()=>state==="done"?sendCustomerOut():sendCustomerIn();$("closeSheet").onclick=()=>{tapSound();closeSheet()};$("bgmBtn").onclick=()=>{tapSound();bgmOn=!bgmOn;$("bgmBtn").classList.toggle("off",!bgmOn);bgmOn?startBgm():stopBgm()};$("sfxBtn").onclick=()=>{sfxOn=!sfxOn;$("sfxBtn").classList.toggle("off",!sfxOn);if(sfxOn)tapSound()};window.addEventListener("resize",()=>{if($("bubble").style.display==="block")positionBubble()});updateHud();
</script>
</body>
</html>
